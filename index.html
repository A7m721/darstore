<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">المتجر الإلكتروني</title>
<link rel="icon" id="favicon" href="">
<style>
/* =========================================================
   style.css — واجهة العملاء (Luxury Dark Theme)
   -----------------------------------------------------------
   نظام التصميم:
   الألوان:
     --bg         #0B1512   خلفية أساسية داكنة (أخضر-أسود عميق)
     --bg-2       #0F1D18   خلفية ثانوية (الهيدر/الفوتر)
     --surface    #142420   خلفية البطاقات
     --surface-2  #1B2E27   حالة hover / حقول الإدخال
     --line       rgba(255,255,255,.09)  فواصل خفيفة
     --gold       #D9A441   ذهبي أساسي (العلامة المميزة)
     --gold-bright#EAC777   ذهبي فاتح (hover)
     --gold-deep  #B5822B   ذهبي غامق (نص على خلفية فاتحة)
     --forest     #33A379   أخضر النجاح/التوفر
     --forest-2   #45C293   أخضر hover
     --text       #F4F1E8   نص أساسي (أبيض دافئ)
     --text-muted #93A79C   نص ثانوي
     --danger     #E5695B
   الخطوط:
     Almarai  — عرض/عناوين، وزن 800
     Tajawal  — نص أساسي
     IBM Plex Sans Arabic — أرقام/أسعار/بيانات
   العنصر المميز (Signature):
     "بطاقة السعر" — شكل تذكرة مقصوصة الجانب (clip-path) للشارات،
     مع لمسة "توهج ذهبي" خفيفة (glow) عند التفاعل بدل الظل العادي،
     لتُبرز إحساس الفخامة على الخلفية الداكنة.
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@300;400;500;700&family=IBM+Plex+Sans+Arabic:wght@500;600;700&display=swap');

:root{
  --bg:#0B1512;
  --bg-2:#0F1D18;
  --surface:#142420;
  --surface-2:#1B2E27;
  --surface-3:#24382F;
  --line:rgba(255,255,255,.09);
  --gold:#D9A441;
  --gold-bright:#EAC777;
  --gold-deep:#B5822B;
  --forest:#33A379;
  --forest-2:#45C293;
  --text:#F4F1E8;
  --text-muted:#93A79C;
  --danger:#E5695B;
  --radius:16px;
  --radius-sm:10px;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  --shadow-lg: 0 24px 60px rgba(0,0,0,.5);
  --glow-gold: 0 0 0 1px rgba(217,164,65,.35), 0 8px 24px rgba(217,164,65,.15);
  --ease: cubic-bezier(.22,.8,.28,1);
}

*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}
body{
  font-family:'Tajawal', sans-serif;
  background:var(--bg);
  color:var(--text);
  direction:rtl;
  line-height:1.65;
  font-size:15px;
}
h1,h2,h3,.brand-name{font-family:'Almarai', sans-serif; letter-spacing:-.01em;}
.numeral, .price-now, .price-old, .cart-count, .badge-discount{font-family:'IBM Plex Sans Arabic', 'Tajawal', sans-serif; font-variant-numeric:tabular-nums;}
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none; -webkit-tap-highlight-color:transparent; background:none; color:inherit;}
ul{list-style:none;}
.container{max-width:1240px; margin:0 auto; padding:0 20px;}
:focus-visible{outline:2.5px solid var(--gold); outline-offset:2px; border-radius:4px;}
::selection{background:rgba(217,164,65,.35);}

/* ---------- Scrollbar (dark) ---------- */
*{scrollbar-color:var(--surface-3) transparent; scrollbar-width:thin;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:8px;}

/* ---------- Top bar ---------- */
.topbar{
  background:#070E0B; color:var(--text-muted); font-size:12.5px; letter-spacing:.01em;
  border-bottom:1px solid var(--line);
}
.topbar .container{display:flex; justify-content:space-between; align-items:center; height:36px;}
.topbar a{opacity:.9}
.topbar a:hover{opacity:1; color:var(--gold);}

/* ---------- Header ---------- */
header.site-header{
  background:rgba(11,21,18,.85);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:50;
}
.header-inner{
  display:flex; align-items:center; gap:24px;
  height:80px;
}
.brand{display:flex; align-items:center; gap:11px; flex-shrink:0;}
.brand img{height:42px; width:42px; object-fit:contain; border-radius:11px; box-shadow:0 2px 10px rgba(0,0,0,.4);}
.brand-name{font-size:21px; font-weight:800; color:var(--gold-bright);}

.search-box{
  flex:1; max-width:520px; position:relative;
}
.search-box input{
  width:100%; height:46px; border-radius:999px;
  border:1.5px solid var(--line); background:var(--surface);
  color:var(--text); padding:0 46px 0 18px; font-size:14.5px; font-family:inherit;
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.search-box input::placeholder{color:var(--text-muted);}
.search-box input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 4px rgba(217,164,65,.12);}
.search-box svg{position:absolute; right:16px; top:50%; transform:translateY(-50%); width:17px; height:17px; stroke:var(--text-muted); pointer-events:none;}

.header-actions{display:flex; align-items:center; gap:12px; margin-right:auto;}
.icon-btn{
  position:relative; width:44px; height:44px; border-radius:50%; background:var(--surface);
  border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
  transition:background .2s var(--ease), border-color .2s var(--ease), transform .15s var(--ease);
}
.icon-btn svg{width:19px; height:19px;}
.icon-btn:hover{background:var(--surface-2); border-color:var(--gold); transform:translateY(-1px);}
.cart-btn{
  position:relative; display:flex; align-items:center; gap:8px;
  background:var(--gold); color:#1A1005; padding:11px 22px; border-radius:999px;
  font-weight:700; font-size:14px; transition:background .2s var(--ease), transform .15s var(--ease), box-shadow .2s var(--ease);
}
.cart-btn svg{width:18px; height:18px;}
.cart-btn:hover{background:var(--gold-bright); transform:translateY(-1px); box-shadow:var(--glow-gold);}
.cart-count{
  position:absolute; top:-6px; left:-6px; background:var(--forest);
  color:#052018; font-size:11px; font-weight:800; min-width:20px; height:20px;
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  border:2px solid var(--bg);
}

.main-nav{border-top:1px solid var(--line);}
.main-nav ul{display:flex; gap:28px; height:46px; align-items:center; overflow-x:auto;}
.main-nav a{font-size:14px; font-weight:500; white-space:nowrap; color:var(--text-muted); position:relative; padding:4px 0;}
.main-nav a::after{content:''; position:absolute; right:0; left:0; bottom:-1px; height:2px; background:var(--gold); transform:scaleX(0); transition:transform .2s var(--ease);}
.main-nav a:hover{color:var(--text);}
.main-nav a:hover::after{transform:scaleX(1);}

/* ---------- Categories strip ---------- */
.cats-section{padding:26px 0 4px;}
.cats-track{display:flex; gap:18px; overflow-x:auto; padding:4px 4px 12px; scrollbar-width:thin;}
.cat-pill{
  flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:9px;
  cursor:pointer; width:86px; text-align:center;
}
.cat-pill .circle{
  width:66px; height:66px; border-radius:50%; overflow:hidden;
  background:var(--surface); border:2px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:24px;
  transition:border-color .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
}
.cat-pill.active .circle, .cat-pill:hover .circle{border-color:var(--gold); transform:translateY(-3px); box-shadow:var(--glow-gold);}
.cat-pill .circle img{width:100%; height:100%; object-fit:cover;}
.cat-pill span{font-size:12px; font-weight:500; color:var(--text-muted);}
.cat-pill.active span{color:var(--gold-bright); font-weight:700;}
.cat-pill.active{position:relative;}
.cat-pill.active::after{
  content:''; width:16px; height:5px; background:var(--gold); border-radius:3px; margin-top:-2px;
}

/* ---------- Hero / Banners ---------- */
.hero{position:relative; margin:22px 0 44px; border-radius:22px; overflow:hidden; box-shadow:var(--shadow-lg); border:1px solid var(--line);}
.hero-slide{
  position:relative; min-height:400px; display:flex; align-items:center;
  background-size:cover; background-position:center;
}
.hero-slide::before{
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg, rgba(6,13,10,.92) 8%, rgba(6,13,10,.5) 55%, rgba(6,13,10,.1) 100%);
}
.hero-content{position:relative; z-index:2; color:#fff; padding:0 54px; max-width:580px;}
.hero-eyebrow{
  display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700;
  color:var(--gold-bright); letter-spacing:.06em; margin-bottom:16px; text-transform:uppercase;
}
.hero-eyebrow::before{content:''; width:24px; height:2px; background:var(--gold); display:inline-block;}
.hero-content h2{font-size:40px; margin-bottom:15px; line-height:1.25; font-weight:800;}
.hero-content p{font-size:16px; opacity:.85; margin-bottom:26px; max-width:460px;}
.hero-content a.btn{
  display:inline-flex; align-items:center; gap:8px; background:var(--gold); color:#1A1005; font-weight:800;
  padding:14px 32px; border-radius:999px; font-size:14.5px; transition:background .2s var(--ease), transform .15s var(--ease), box-shadow .2s var(--ease);
}
.hero-content a.btn:hover{background:var(--gold-bright); transform:translateY(-2px); box-shadow:var(--glow-gold);}
.hero-dots{position:absolute; bottom:22px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:3;}
.hero-dots span{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.35); cursor:pointer; transition:all .2s var(--ease);}
.hero-dots span.active{background:var(--gold); width:24px; border-radius:4px;}

/* ---------- Section titles ---------- */
.section-title{display:flex; align-items:center; justify-content:space-between; margin:46px 0 22px; flex-wrap:wrap; gap:14px;}
.section-title h3{font-size:23px; font-weight:800; position:relative; padding-right:18px;}
.section-title h3::before{
  content:''; position:absolute; right:0; top:3px; bottom:3px; width:5px; background:var(--gold);
  clip-path:polygon(0 0, 100% 15%, 100% 85%, 0 100%);
}
.sort-control{display:flex; align-items:center; gap:10px;}
.sort-control label{font-size:12.5px; color:var(--text-muted); font-weight:500;}
.sort-control select{
  background:var(--surface); border:1.5px solid var(--line); color:var(--text);
  padding:9px 14px; border-radius:10px; font-size:13.5px; font-family:inherit;
  transition:border-color .15s;
}
.sort-control select:focus{outline:none; border-color:var(--gold);}

/* ---------- Products grid ---------- */
.products-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(224px,1fr)); gap:22px;
  margin-bottom:24px;
}
.product-card{
  background:var(--surface); border-radius:var(--radius); overflow:hidden;
  box-shadow:var(--shadow); display:flex; flex-direction:column;
  transition:transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease);
  border:1px solid var(--line);
  animation:card-rise .4s var(--ease) backwards;
}
@keyframes card-rise{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.product-card:nth-child(6n+1){animation-delay:.02s}
.product-card:nth-child(6n+2){animation-delay:.06s}
.product-card:nth-child(6n+3){animation-delay:.1s}
.product-card:nth-child(6n+4){animation-delay:.14s}
.product-card:nth-child(6n+5){animation-delay:.18s}
.product-card:nth-child(6n+6){animation-delay:.22s}
.product-card:hover{transform:translateY(-5px); box-shadow:var(--shadow-lg); border-color:rgba(217,164,65,.35);}
.product-thumb{position:relative; aspect-ratio:1/1; background:var(--surface-2); overflow:hidden; cursor:pointer;}
.product-thumb img{width:100%; height:100%; object-fit:cover; transition:transform .4s var(--ease);}
.product-card:hover .product-thumb img{transform:scale(1.07);}

/* شارة الخصم بشكل "تذكرة" مقصوصة الحواف الجانبية — العنصر المميز للتصميم */
.badge-discount{
  position:absolute; top:12px; right:0; background:var(--forest); color:#052018;
  font-size:12px; font-weight:700; padding:6px 14px 6px 10px;
  clip-path:polygon(0 0, 100% 0, 100% 100%, 0 100%, 10% 50%);
}
.badge-oos{
  position:absolute; inset:0; background:rgba(6,13,10,.72); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14.5px;
  backdrop-filter:blur(1px);
}
/* زر المفضلة على البطاقة */
.wishlist-btn{
  position:absolute; top:12px; left:12px; width:34px; height:34px; border-radius:50%;
  background:rgba(11,21,18,.55); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center;
  transition:background .2s, transform .15s; z-index:2;
}
.wishlist-btn svg{width:17px; height:17px; stroke:#fff; fill:none; transition:fill .15s, stroke .15s;}
.wishlist-btn:hover{transform:scale(1.08);}
.wishlist-btn.active svg{fill:var(--danger); stroke:var(--danger);}

/* زر المعاينة السريعة — يظهر عند التمرير فوق الصورة */
.quickview-btn{
  position:absolute; bottom:-46px; left:50%; transform:translateX(-50%);
  background:var(--gold); color:#1A1005; font-size:12.5px; font-weight:700;
  padding:9px 18px; border-radius:999px; white-space:nowrap; display:flex; align-items:center; gap:6px;
  transition:bottom .25s var(--ease), background .15s; z-index:2;
}
.product-thumb:hover .quickview-btn{bottom:14px;}
.quickview-btn:hover{background:var(--gold-bright);}
.quickview-btn svg{width:14px; height:14px;}

.product-info{padding:15px 16px 17px; display:flex; flex-direction:column; gap:8px; flex:1;}
.product-name{font-size:14.5px; font-weight:700; cursor:pointer; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:38px; transition:color .15s;}
.product-name:hover{color:var(--gold-bright);}

/* تقييم النجوم */
.rating-row{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted);}
.stars{display:inline-flex; gap:1px; color:var(--gold);}
.stars .star-empty{color:var(--surface-3);}

.price-row{display:flex; align-items:baseline; gap:9px;}
.price-now{font-size:18px; font-weight:700; color:var(--gold-bright);}
.price-old{font-size:12.5px; color:var(--text-muted); text-decoration:line-through;}
.product-actions{display:flex; gap:8px; margin-top:auto;}
.btn-details{
  flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
  padding:10px 8px; font-size:12.5px; font-weight:700; color:var(--text); transition:background .15s;
}
.btn-details:hover{background:var(--surface-3);}
.btn-add{
  flex:1; background:var(--gold); color:#1A1005; border-radius:10px; padding:10px 8px;
  font-size:12.5px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px;
  transition:background .15s, transform .15s;
}
.btn-add:hover{background:var(--gold-bright); transform:translateY(-1px);}
.btn-add:disabled, .btn-details:disabled{opacity:.5; cursor:not-allowed; transform:none;}

.empty-state{padding:70px 20px; text-align:center; color:var(--text-muted); font-size:14.5px;}

/* ---------- Modal generic ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(4,10,8,.75); z-index:200;
  display:flex; align-items:center; justify-content:center; padding:20px;
  opacity:0; pointer-events:none; transition:opacity .25s var(--ease);
  backdrop-filter:blur(3px);
}
.modal-overlay.open{opacity:1; pointer-events:auto;}
.modal-box{
  background:var(--surface); border-radius:20px; max-width:920px; width:100%;
  max-height:88vh; overflow-y:auto; position:relative; box-shadow:0 40px 90px rgba(0,0,0,.6);
  transform:translateY(18px) scale(.98); transition:transform .25s var(--ease);
  border:1px solid var(--line);
}
.modal-overlay.open .modal-box{transform:translateY(0) scale(1);}
.modal-close{
  position:absolute; top:16px; left:16px; width:36px; height:36px; border-radius:50%;
  background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:17px; z-index:5;
  transition:background .15s; color:var(--text);
}
.modal-close:hover{background:var(--surface-3);}

/* ---------- Product detail modal ---------- */
.detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:0;}
.detail-gallery{background:var(--surface-2); padding:26px; display:flex; flex-direction:column; gap:14px;}
.detail-gallery .main-img{aspect-ratio:1/1; border-radius:16px; overflow:hidden; background:var(--surface-3);}
.detail-gallery .main-img img{width:100%; height:100%; object-fit:cover;}
.thumb-row{display:flex; gap:9px;}
.thumb-row img{width:58px; height:58px; object-fit:cover; border-radius:9px; cursor:pointer; border:2px solid transparent; transition:border-color .15s;}
.thumb-row img.active{border-color:var(--gold);}
.detail-info{padding:46px 32px 32px; display:flex; flex-direction:column; gap:15px;}
.detail-top-row{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.detail-cat{font-size:12px; color:var(--gold-bright); font-weight:700; letter-spacing:.04em; text-transform:uppercase;}
.detail-info h2{font-size:25px; font-weight:800;}
.detail-desc{color:var(--text-muted); font-size:14.5px; line-height:1.85;}
.detail-price-row{display:flex; align-items:baseline; gap:12px;}
.detail-price-row .price-now{font-size:27px;}
.detail-stock{font-size:13px; color:var(--text-muted);}
.qty-row{display:flex; align-items:center; gap:14px; margin-top:6px;}
.qty-control{display:flex; align-items:center; border:1.5px solid var(--line); border-radius:11px; overflow:hidden;}
.qty-control button{width:38px; height:38px; background:var(--surface-2); font-size:18px; transition:background .15s;}
.qty-control button:hover{background:var(--surface-3);}
.qty-control span{width:42px; text-align:center; font-weight:700;}
.detail-actions-row{display:flex; gap:10px;}
.detail-add-btn{
  flex:1; background:var(--gold); color:#1A1005; padding:15px; border-radius:13px; font-weight:800; font-size:15px;
  transition:background .15s, transform .15s;
}
.detail-add-btn:hover{background:var(--gold-bright); transform:translateY(-1px);}
.detail-wishlist-btn{
  width:52px; border-radius:13px; background:var(--surface-2); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; transition:background .15s;
}
.detail-wishlist-btn svg{width:19px; height:19px; stroke:var(--text); fill:none;}
.detail-wishlist-btn.active svg{fill:var(--danger); stroke:var(--danger);}
.detail-wishlist-btn:hover{background:var(--surface-3);}

/* ---------- Reviews ---------- */
.reviews-section{border-top:1px solid var(--line); padding:26px 32px 32px; grid-column:1/-1;}
.reviews-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:12px;}
.reviews-header h4{font-size:17px; font-weight:800;}
.reviews-summary{display:flex; align-items:center; gap:10px;}
.reviews-summary .avg-num{font-size:26px; font-weight:800; color:var(--gold-bright);}
.reviews-list{display:flex; flex-direction:column; gap:16px; margin-bottom:22px; max-height:280px; overflow-y:auto; padding-left:6px;}
.review-item{background:var(--surface-2); border-radius:12px; padding:14px 16px; border:1px solid var(--line);}
.review-item-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
.review-item-head strong{font-size:13.5px;}
.review-date{font-size:11.5px; color:var(--text-muted);}
.review-comment{font-size:13.5px; color:var(--text-muted); line-height:1.7;}
.no-reviews{color:var(--text-muted); font-size:13.5px; padding:10px 0;}
.review-form{display:flex; flex-direction:column; gap:12px; background:var(--surface-2); border:1px solid var(--line); border-radius:14px; padding:18px;}
.review-form h5{font-size:14px; font-weight:700;}
.star-picker{display:flex; gap:6px; font-size:24px; color:var(--surface-3); cursor:pointer;}
.star-picker span.active, .star-picker span:hover{color:var(--gold);}
.review-form input, .review-form textarea{
  width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px 13px;
  font-family:inherit; font-size:13.5px; background:var(--surface); color:var(--text);
}
.review-form input:focus, .review-form textarea:focus{outline:none; border-color:var(--gold);}
.review-submit-btn{background:var(--gold); color:#1A1005; padding:11px; border-radius:10px; font-weight:800; font-size:13.5px; align-self:flex-start; padding-inline:22px; transition:background .15s;}
.review-submit-btn:hover{background:var(--gold-bright);}

@media(max-width:760px){

/* ---------- Toast ---------- */
.toast{
  position:fixed; bottom:28px; right:50%; transform:translateX(50%) translateY(8px);
  background:var(--surface-3); color:var(--text); padding:14px 24px; border-radius:999px;

<script type="module">
// =========================================================
// firebase-config.js
// إعدادات Firebase المشتركة بين واجهة العملاء ولوحة الإدارة
// =========================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {
  getFirestore,
  collection,
  doc,
  getDoc,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  setDoc,
  query,
  orderBy,
  where,
  onSnapshot,
  serverTimestamp,
  increment
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAC9oiJOcmKy7U4OxVRHIy-UjZKGCGnEk4",
  authDomain: "ahmed-3fd0f.firebaseapp.com",
  databaseURL: "https://ahmed-3fd0f-default-rtdb.firebaseio.com",
  projectId: "ahmed-3fd0f",
  storageBucket: "ahmed-3fd0f.firebasestorage.app",
  messagingSenderId: "474645723316",
  appId: "1:474645723316:web:b99903f5d627d84cfcffe1",
  measurementId: "G-NEFCS7RVW6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// =========================================================
// customer.js — منطق واجهة العملاء (index.html)
// =========================================================
/* ---------------- State ---------------- */
let ALL_PRODUCTS = [];
let ALL_CATEGORIES = [];
let REVIEWS = [];
let SETTINGS = {};
let currentCategory = "all";
let currentSearch = "";
let currentSort = "newest";
let cart = JSON.parse(localStorage.getItem("store_cart") || "[]");
let wishlist = JSON.parse(localStorage.getItem("store_wishlist") || "[]");
let heroSlideIndex = 0;
let heroTimer = null;

/* ---------------- Helpers ---------------- */
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);
const money = (n) => `${Number(n || 0).toLocaleString("ar-EG")} ج.م`;
const escapeHtml = (str) => String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function renderStars(avg) {
  const rounded = Math.round(avg || 0);
  let html = '<span class="stars">';
  for (let i = 1; i <= 5; i++) html += `<span class="${i <= rounded ? "" : "star-empty"}">★</span>`;
  return html + "</span>";
}

function getReviewStats(productId) {
  const list = REVIEWS.filter(r => r.productId === productId);
  if (!list.length) return { avg: 0, count: 0 };
  const sum = list.reduce((s, r) => s + (Number(r.rating) || 0), 0);
  return { avg: sum / list.length, count: list.length };
}

function showToast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

function saveCart() {
  localStorage.setItem("store_cart", JSON.stringify(cart));
  renderCartCount();
}

/* ---------------- Settings ---------------- */
async function loadSettings() {
  try {
    const snap = await getDoc(doc(db, "settings", "main"));
    SETTINGS = snap.exists() ? snap.data() : {};
  } catch (e) {
    console.error("خطأ في تحميل الإعدادات:", e);
    SETTINGS = {};
  }
  applySettings();
}

function applySettings() {
  const s = SETTINGS;
  if (s.storeName) {
    $("#store-name").textContent = s.storeName;
    $("#footer-store-name").textContent = s.storeName;
    $("#page-title").textContent = s.storeName;
  }
  if (s.logoUrl) $("#store-logo").src = s.logoUrl;
  if (s.faviconUrl) $("#favicon").href = s.faviconUrl;
  if (s.phone) $("#topbar-phone").textContent = "📞 " + s.phone;
  if (s.phone) $("#footer-phone").textContent = "📞 " + s.phone;
  if (s.email) $("#footer-email").textContent = "✉️ " + s.email;
  if (s.address) $("#footer-address").textContent = "📍 " + s.address;
  if (s.privacyPolicy) $("#link-privacy").addEventListener("click", (e) => {
    e.preventDefault(); openTextModal("سياسة الخصوصية", s.privacyPolicy);
  });
  if (s.termsAndConditions) $("#link-terms").addEventListener("click", (e) => {
    e.preventDefault(); openTextModal("الشروط والأحكام", s.termsAndConditions);
  });
  if (s.whatsapp) $("#link-whatsapp").href = `https://wa.me/${s.whatsapp.replace(/\D/g,"")}`;

  const social = $("#footer-social");
  social.innerHTML = "";
  if (s.facebook) social.innerHTML += `<a href="${s.facebook}" target="_blank">f</a>`;
  if (s.instagram) social.innerHTML += `<a href="${s.instagram}" target="_blank">ig</a>`;
  if (s.whatsapp) social.innerHTML += `<a href="https://wa.me/${s.whatsapp.replace(/\D/g,"")}" target="_blank">wa</a>`;

  $("#footer-year").textContent = new Date().getFullYear();
}

function openTextModal(title, text) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay open";
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:600px; padding:36px;">
      <button class="modal-close" style="position:absolute;">✕</button>
      <h3 style="margin-bottom:16px;">${title}</h3>
      <p style="white-space:pre-line; color:#5b665e; font-size:14.5px; line-height:1.9;">${text}</p>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector(".modal-close").onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
}

/* ---------------- Banners ---------------- */
async function loadBanners() {
  try {
    const q = query(collection(db, "banners"), orderBy("order", "asc"));
    const snap = await getDocs(q);
    const banners = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(b => b.active !== false);
    renderHero(banners);
  } catch (e) {
    console.error("خطأ في تحميل البانرات:", e);
    $("#hero-section").style.display = "none";
  }
}

function renderHero(banners) {
  if (!banners.length) { $("#hero-section").style.display = "none"; return; }
  const track = $("#hero-track");
  const dots = $("#hero-dots");
  track.innerHTML = banners.map((b, i) => `
    <div class="hero-slide" data-i="${i}" style="background-image:url('${b.imageUrl || ""}'); ${i === 0 ? "" : "display:none;"}">
      <div class="hero-content">
        <span class="hero-eyebrow">عرض مميز</span>
        <h2>${b.title || ""}</h2>
        <p>${b.description || ""}</p>
        ${b.buttonLink ? `<a class="btn" href="${b.buttonLink}">تسوق الآن</a>` : ""}
      </div>
    </div>`).join("");
  dots.innerHTML = banners.map((_, i) => `<span data-i="${i}" class="${i === 0 ? "active" : ""}"></span>`).join("");
  dots.querySelectorAll("span").forEach(s => s.onclick = () => setHeroSlide(+s.dataset.i, banners.length));

  clearInterval(heroTimer);
  if (banners.length > 1) {
    heroTimer = setInterval(() => setHeroSlide((heroSlideIndex + 1) % banners.length, banners.length), 5000);
  }
}

function setHeroSlide(i, total) {
  heroSlideIndex = i;
  $$("#hero-track .hero-slide").forEach(el => el.style.display = (+el.dataset.i === i ? "" : "none"));
  $$("#hero-dots span").forEach(el => el.classList.toggle("active", +el.dataset.i === i));
}

/* ---------------- Categories ---------------- */
async function loadCategories() {
  try {
    const q = query(collection(db, "categories"), orderBy("order", "asc"));
    const snap = await getDocs(q);
    ALL_CATEGORIES = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) {
    console.error("خطأ في تحميل الأقسام:", e);
    ALL_CATEGORIES = [];
  }
  renderCategories();
}

function renderCategories() {
  const track = $("#cats-track");
  const navList = $("#nav-categories-list");

  track.innerHTML = `
    <div class="cat-pill ${currentCategory === "all" ? "active" : ""}" data-cat="all">
      <div class="circle">🛍️</div><span>الكل</span>
    </div>` +
    ALL_CATEGORIES.map(c => `
      <div class="cat-pill ${currentCategory === c.id ? "active" : ""}" data-cat="${c.id}">
        <div class="circle"><img src="${c.imageUrl || ""}" alt="${c.name || ""}"></div>
        <span>${c.name || ""}</span>
      </div>`).join("");

  navList.innerHTML = `<li><a href="#products" data-cat="all" class="nav-cat-link">جميع المنتجات</a></li>` +
    ALL_CATEGORIES.map(c => `<li><a href="#products" data-cat="${c.id}" class="nav-cat-link">${c.name || ""}</a></li>`).join("");

  $$(".cat-pill").forEach(el => el.onclick = () => { currentCategory = el.dataset.cat; renderCategories(); renderProducts(); });
  $$(".nav-cat-link").forEach(el => el.onclick = () => { currentCategory = el.dataset.cat; renderCategories(); renderProducts(); });
}

/* ---------------- Reviews ---------------- */
async function loadReviews() {
  try {
    const snap = await getDocs(collection(db, "reviews"));
    REVIEWS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) {
    console.error("خطأ في تحميل التقييمات:", e);
    REVIEWS = [];
  }
}

/* ---------------- Products ---------------- */
async function loadProducts() {
  try {
    const snap = await getDocs(collection(db, "products"));
    ALL_PRODUCTS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) {
    console.error("خطأ في تحميل المنتجات:", e);
    ALL_PRODUCTS = [];
  }
  renderProducts();
}

function getFilteredProducts() {
  const list = ALL_PRODUCTS.filter(p => {
    const matchesCat = currentCategory === "all" || p.category === currentCategory;
    const s = currentSearch.trim().toLowerCase();
    const matchesSearch = !s || (p.name || "").toLowerCase().includes(s) || (p.description || "").toLowerCase().includes(s);
    return matchesCat && matchesSearch;
  });

  const sorted = list.slice();
  if (currentSort === "price-asc") sorted.sort((a, b) => (a.price || 0) - (b.price || 0));
  else if (currentSort === "price-desc") sorted.sort((a, b) => (b.price || 0) - (a.price || 0));
  else if (currentSort === "bestselling") sorted.sort((a, b) => (b.soldCount || 0) - (a.soldCount || 0));
  else sorted.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
  return sorted;
}

function renderProducts() {
  const grid = $("#products-grid");
  const list = getFilteredProducts();
  $("#products-title").textContent = currentCategory === "all"
    ? "كل المنتجات"
    : (ALL_CATEGORIES.find(c => c.id === currentCategory)?.name || "المنتجات");

  if (!list.length) {
    grid.innerHTML = `<div class="empty-state">لا توجد منتجات مطابقة</div>`;
    return;
  }

  grid.innerHTML = list.map(p => {
    const hasDiscount = p.oldPrice && p.oldPrice > p.price;
    const discountPct = hasDiscount ? Math.round((1 - p.price / p.oldPrice) * 100) : 0;
    const outOfStock = p.status === "unavailable" || Number(p.quantity) <= 0;
    const stats = getReviewStats(p.id);
    const inWishlist = wishlist.includes(p.id);
    return `
    <div class="product-card" data-id="${p.id}">
      <div class="product-thumb" data-action="details">
        <img src="${p.mainImage || ""}" alt="${p.name || ""}" loading="lazy">
        ${hasDiscount ? `<span class="badge-discount">خصم ${discountPct}%</span>` : ""}
        <button class="wishlist-btn ${inWishlist ? "active" : ""}" data-action="wishlist" aria-label="المفضلة">
          <svg viewBox="0 0 24 24"><path d="M20.8 4.6c-1.7-1.5-4.4-1.5-6 .2L12 7.6l-2.8-2.8c-1.6-1.7-4.3-1.7-6 0-1.7 1.7-1.7 4.4 0 6.2L12 20l8.8-8.9c1.7-1.8 1.7-4.6 0-6.3z"/></svg>
        </button>
        <button class="quickview-btn" data-action="details">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          معاينة سريعة
        </button>
        ${outOfStock ? `<div class="badge-oos">غير متوفر</div>` : ""}
      </div>
      <div class="product-info">
        <div class="product-name" data-action="details">${p.name || ""}</div>
        <div class="rating-row">${renderStars(stats.avg)} <span>${stats.count ? `${stats.avg.toFixed(1)} (${stats.count})` : "لا يوجد تقييم"}</span></div>
        <div class="price-row">
          <span class="price-now">${money(p.price)}</span>
          ${hasDiscount ? `<span class="price-old">${money(p.oldPrice)}</span>` : ""}
        </div>
        <div class="product-actions">
          <button class="btn-details" data-action="details">التفاصيل</button>
          <button class="btn-add" data-action="add" ${outOfStock ? "disabled" : ""}>أضف للسلة</button>
        </div>
      </div>
    </div>`;
  }).join("");

  grid.querySelectorAll(".product-card").forEach(card => {
    const id = card.dataset.id;
    card.querySelectorAll('[data-action="details"]').forEach(el => el.onclick = () => openDetailModal(id));
    const addBtn = card.querySelector('[data-action="add"]');
    if (addBtn) addBtn.onclick = () => addToCart(id, 1);
    const wishBtn = card.querySelector('[data-action="wishlist"]');
    if (wishBtn) wishBtn.onclick = (e) => {
      e.stopPropagation();
      toggleWishlist(id);
      wishBtn.classList.toggle("active", wishlist.includes(id));
    };
  });
}

/* ---------------- Product detail modal ---------------- */
function openDetailModal(productId) {
  const p = ALL_PRODUCTS.find(x => x.id === productId);
  if (!p) return;
  const images = [p.mainImage, ...(p.images || [])].filter(Boolean);
  const outOfStock = p.status === "unavailable" || Number(p.quantity) <= 0;
  const catName = ALL_CATEGORIES.find(c => c.id === p.category)?.name || "";
  const hasDiscount = p.oldPrice && p.oldPrice > p.price;
  const stats = getReviewStats(p.id);
  const inWishlist = wishlist.includes(p.id);
  const productReviews = REVIEWS.filter(r => r.productId === p.id).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

  $("#detail-content").innerHTML = `
    <div class="detail-gallery">
      <div class="main-img"><img id="detail-main-img" src="${images[0] || ""}"></div>
      <div class="thumb-row">
        ${images.map((img, i) => `<img src="${img}" class="${i === 0 ? "active" : ""}" data-src="${img}">`).join("")}
      </div>
    </div>
    <div class="detail-info">
      <div class="detail-cat">${catName}</div>
      <h2>${p.name || ""}</h2>
      <div class="rating-row">${renderStars(stats.avg)} <span>${stats.count ? `${stats.avg.toFixed(1)} (${stats.count} تقييم)` : "لا يوجد تقييمات بعد"}</span></div>
      <p class="detail-desc">${p.description || ""}</p>
      <div class="detail-price-row">
        <span class="price-now">${money(p.price)}</span>
        ${hasDiscount ? `<span class="price-old">${money(p.oldPrice)}</span>` : ""}
      </div>
      <div class="detail-stock">${outOfStock ? "غير متوفر حاليًا" : `الكمية المتاحة: ${p.quantity ?? "-"}`}</div>
      <div class="qty-row">
        <div class="qty-control">
          <button id="qty-minus">−</button>
          <span id="qty-value">1</span>
          <button id="qty-plus">+</button>
        </div>
      </div>
      <div class="detail-actions-row">
        <button class="detail-add-btn" id="detail-add-btn" ${outOfStock ? "disabled" : ""}>إضافة للسلة</button>
        <button class="detail-wishlist-btn ${inWishlist ? "active" : ""}" id="detail-wishlist-btn" aria-label="المفضلة">
          <svg viewBox="0 0 24 24"><path d="M20.8 4.6c-1.7-1.5-4.4-1.5-6 .2L12 7.6l-2.8-2.8c-1.6-1.7-4.3-1.7-6 0-1.7 1.7-1.7 4.4 0 6.2L12 20l8.8-8.9c1.7-1.8 1.7-4.6 0-6.3z"/></svg>
        </button>
      </div>
    </div>
    <div class="reviews-section">
      <div class="reviews-header">
        <h4>التقييمات والمراجعات</h4>
        <div class="reviews-summary">
          <span class="avg-num">${stats.count ? stats.avg.toFixed(1) : "–"}</span>
          ${renderStars(stats.avg)}
          <span style="color:var(--text-muted); font-size:12.5px;">(${stats.count} تقييم)</span>
        </div>
      </div>
      <div class="reviews-list">
        ${productReviews.length ? productReviews.map(r => `
          <div class="review-item">
            <div class="review-item-head">
              <strong>${escapeHtml(r.customerName || "عميل")}</strong>
              <span class="review-date">${r.createdAt?.toDate ? r.createdAt.toDate().toLocaleDateString("ar-EG") : ""}</span>
            </div>
            ${renderStars(r.rating)}
            ${r.comment ? `<p class="review-comment">${escapeHtml(r.comment)}</p>` : ""}
          </div>`).join("") : `<div class="no-reviews">لا توجد تقييمات بعد، كن أول من يقيّم هذا المنتج</div>`}
      </div>
      <form class="review-form" id="review-form">
        <h5>أضف تقييمك</h5>
        <div class="star-picker" id="star-picker">
          ${[1, 2, 3, 4, 5].map(n => `<span data-val="${n}" class="${n <= 5 ? "active" : ""}">★</span>`).join("")}
        </div>
        <input type="hidden" id="review-rating" value="5">
        <input type="text" id="review-name" placeholder="اسمك" required>
        <textarea id="review-comment" rows="2" placeholder="رأيك في المنتج (اختياري)"></textarea>
        <button type="submit" class="review-submit-btn">إرسال التقييم</button>
      </form>
    </div>`;

  $("#detail-content").querySelectorAll(".thumb-row img").forEach(t => {
    t.onclick = () => {
      $("#detail-main-img").src = t.dataset.src;
      $("#detail-content").querySelectorAll(".thumb-row img").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
    };
  });

  let qty = 1;
  const qtyEl = $("#qty-value");
  $("#qty-minus").onclick = () => { qty = Math.max(1, qty - 1); qtyEl.textContent = qty; };
  $("#qty-plus").onclick = () => { qty = Math.min(Number(p.quantity) || 99, qty + 1); qtyEl.textContent = qty; };
  const addBtn = $("#detail-add-btn");
  if (addBtn) addBtn.onclick = () => { addToCart(p.id, qty); closeModal("#detail-modal"); };

  const wishBtn = $("#detail-wishlist-btn");
  wishBtn.onclick = () => {
    toggleWishlist(p.id);
    wishBtn.classList.toggle("active", wishlist.includes(p.id));
  };

  let selectedRating = 5;
  const starEls = $$("#star-picker span");
  starEls.forEach(s => {
    s.onclick = () => {
      selectedRating = Number(s.dataset.val);
      $("#review-rating").value = selectedRating;
      starEls.forEach(x => x.classList.toggle("active", Number(x.dataset.val) <= selectedRating));
    };
  });

  $("#review-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = $("#review-name").value.trim();
    const comment = $("#review-comment").value.trim();
    const rating = Number($("#review-rating").value) || 5;
    if (!name) return;
    const submitBtn = e.target.querySelector(".review-submit-btn");
    submitBtn.disabled = true;
    submitBtn.textContent = "جاري الإرسال...";
    try {
      await addDoc(collection(db, "reviews"), {
        productId: p.id, customerName: name, rating, comment, createdAt: serverTimestamp()
      });
      showToast("شكرًا لتقييمك! ⭐");
      await loadReviews();
      openDetailModal(p.id);
      renderProducts();
    } catch (err) {
      console.error("خطأ في إرسال التقييم:", err);
      showToast("حدث خطأ أثناء إرسال التقييم");
      submitBtn.disabled = false;
      submitBtn.textContent = "إرسال التقييم";
    }
  });

  openModal("#detail-modal");
}

/* ---------------- Modal utils ---------------- */
function openModal(sel) { $(sel).classList.add("open"); document.body.style.overflow = "hidden"; }
function closeModal(sel) { $(sel).classList.remove("open"); document.body.style.overflow = ""; }

/* ---------------- Cart ---------------- */
function addToCart(productId, qty) {
  const p = ALL_PRODUCTS.find(x => x.id === productId);
  if (!p) return;
  const existing = cart.find(c => c.id === productId);
  if (existing) existing.qty += qty;
  else cart.push({ id: productId, qty });
  saveCart();
  showToast("تمت الإضافة إلى السلة ✔");
}

function renderCartCount() {
  const total = cart.reduce((s, c) => s + c.qty, 0);
  $("#cart-count").textContent = total;
}

function renderCartDrawer() {
  const list = $("#cart-items-list");
  if (!cart.length) {
    list.innerHTML = `<div class="cart-empty">سلتك فارغة حاليًا</div>`;
    $("#cart-total").textContent = money(0);
    return;
  }
  let total = 0;
  list.innerHTML = cart.map(item => {
    const p = ALL_PRODUCTS.find(x => x.id === item.id);
    if (!p) return "";
    const lineTotal = p.price * item.qty;
    total += lineTotal;
    return `
      <div class="cart-item" data-id="${item.id}">
        <img src="${p.mainImage || ""}">
        <div class="cart-item-info">
          <h4>${p.name}</h4>
          <div class="price-now">${money(p.price)}</div>
          <div class="cart-item-qty">
            <button data-act="minus">−</button>
            <span>${item.qty}</span>
            <button data-act="plus">+</button>
          </div>
          <div class="cart-remove" data-act="remove">إزالة</div>
        </div>
      </div>`;
  }).join("");
  $("#cart-total").textContent = money(total);

  list.querySelectorAll(".cart-item").forEach(el => {
    const id = el.dataset.id;
    el.querySelector('[data-act="minus"]').onclick = () => changeQty(id, -1);
    el.querySelector('[data-act="plus"]').onclick = () => changeQty(id, 1);
    el.querySelector('[data-act="remove"]').onclick = () => removeFromCart(id);
  });
}

function changeQty(id, delta) {
  const item = cart.find(c => c.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(c => c.id !== id);
  saveCart();
  renderCartDrawer();
}

function removeFromCart(id) {
  cart = cart.filter(c => c.id !== id);
  saveCart();
  renderCartDrawer();
}

function getCartTotal() {
  return cart.reduce((sum, item) => {
    const p = ALL_PRODUCTS.find(x => x.id === item.id);
    return sum + (p ? p.price * item.qty : 0);
  }, 0);
}

/* ---------------- Wishlist ---------------- */
function toggleWishlist(id) {
  if (wishlist.includes(id)) {
    wishlist = wishlist.filter(x => x !== id);
  } else {
    wishlist.push(id);
    showToast("أُضيف إلى المفضلة ❤");
  }
  saveWishlist();
}

function saveWishlist() {
  localStorage.setItem("store_wishlist", JSON.stringify(wishlist));
  renderWishlistCount();
}

function renderWishlistCount() {
  $("#wishlist-count").textContent = wishlist.length;
}

function renderWishlistDrawer() {
  const list = $("#wishlist-items-list");
  if (!wishlist.length) {
    list.innerHTML = `<div class="cart-empty">قائمة المفضلة فارغة حاليًا</div>`;
    return;
  }
  list.innerHTML = wishlist.map(id => {
    const p = ALL_PRODUCTS.find(x => x.id === id);
    if (!p) return "";
    const outOfStock = p.status === "unavailable" || Number(p.quantity) <= 0;
    return `
      <div class="cart-item" data-id="${p.id}">
        <img src="${p.mainImage || ""}">
        <div class="cart-item-info">
          <h4>${p.name || ""}</h4>
          <div class="price-now">${money(p.price)}</div>
          <div class="wishlist-item-actions">
            <button class="wishlist-move-btn" data-act="addcart" ${outOfStock ? "disabled" : ""}>أضف للسلة</button>
            <span class="cart-remove" data-act="remove">إزالة</span>
          </div>
        </div>
      </div>`;
  }).join("");

  list.querySelectorAll(".cart-item").forEach(el => {
    const id = el.dataset.id;
    const addBtn = el.querySelector('[data-act="addcart"]');
    if (addBtn) addBtn.onclick = () => { addToCart(id, 1); };
    el.querySelector('[data-act="remove"]').onclick = () => { toggleWishlist(id); renderWishlistDrawer(); };
  });
}

function openWishlistDrawer() {
  renderWishlistDrawer();
  $("#wishlist-drawer").classList.add("open");
  $("#drawer-backdrop").classList.add("open");
}
function closeWishlistDrawer() {
  $("#wishlist-drawer").classList.remove("open");
  $("#drawer-backdrop").classList.remove("open");
}

/* ---------------- Checkout ---------------- */
function openCheckout() {
  if (!cart.length) { showToast("السلة فارغة"); return; }
  const summary = $("#order-summary");
  const total = getCartTotal();
  summary.innerHTML = cart.map(item => {
    const p = ALL_PRODUCTS.find(x => x.id === item.id);
    if (!p) return "";
    return `<div class="row"><span>${p.name} × ${item.qty}</span><span>${money(p.price * item.qty)}</span></div>`;
  }).join("") + `<div class="row" style="font-weight:800; border-top:1px solid var(--line); margin-top:6px; padding-top:8px;"><span>الإجمالي</span><span>${money(total)}</span></div>`;
  $("#checkout-msg").innerHTML = "";
  closeModal("#detail-modal");
  closeDrawer();
  openModal("#checkout-modal");
}

async function submitOrder(e) {
  e.preventDefault();
  const btn = $("#submit-order-btn");
  const name = $("#cust-name").value.trim();
  const phone = $("#cust-phone").value.trim();
  const address = $("#cust-address").value.trim();
  if (!name || !phone || !address) return;

  btn.disabled = true;
  btn.textContent = "جاري إرسال الطلب...";

  try {
    const items = cart.map(item => {
      const p = ALL_PRODUCTS.find(x => x.id === item.id);
      return { productId: item.id, name: p?.name || "", price: p?.price || 0, qty: item.qty };
    });
    const total = getCartTotal();

    await addDoc(collection(db, "orders"), {
      customerName: name,
      phone,
      address,
      items,
      total,
      status: "جديد",
      createdAt: serverTimestamp()
    });

    await upsertCustomer(name, phone, total);
    await Promise.all(items.map(item =>
      updateDoc(doc(db, "products", item.productId), { soldCount: increment(item.qty) }).catch(() => {})
    ));

    $("#checkout-msg").innerHTML = `<div class="form-msg success">تم إرسال طلبك بنجاح! سنتواصل معك قريبًا.</div>`;
    cart = [];
    saveCart();
    setTimeout(() => {
      closeModal("#checkout-modal");
      $("#checkout-form").reset();
    }, 1800);
  } catch (err) {
    console.error("خطأ في إرسال الطلب:", err);
    $("#checkout-msg").innerHTML = `<div class="form-msg error">حدث خطأ أثناء إرسال الطلب، حاول مرة أخرى.</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "تأكيد الطلب";
  }
}

async function upsertCustomer(name, phone, orderTotal) {
  try {
    const q = query(collection(db, "customers"), where("phone", "==", phone));
    const snap = await getDocs(q);
    if (snap.empty) {
      await addDoc(collection(db, "customers"), {
        name, phone,
        ordersCount: 1,
        totalPurchases: orderTotal,
        lastOrder: serverTimestamp()
      });
    } else {
      const custDoc = snap.docs[0];
      await updateDoc(doc(db, "customers", custDoc.id), {
        name,
        ordersCount: increment(1),
        totalPurchases: increment(orderTotal),
        lastOrder: serverTimestamp()
      });
    }
  } catch (e) {
    console.error("خطأ في تحديث بيانات العميل:", e);
  }
}

/* ---------------- Drawer ---------------- */
function openDrawer() {
  renderCartDrawer();
  $("#cart-drawer").classList.add("open");
  $("#drawer-backdrop").classList.add("open");
}
function closeDrawer() {
  $("#cart-drawer").classList.remove("open");
  $("#drawer-backdrop").classList.remove("open");
}

/* ---------------- Search ---------------- */
let searchTimer;
function handleSearch(e) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    currentSearch = e.target.value;
    renderProducts();
  }, 250);
}

/* ---------------- Event bindings ---------------- */
function bindEvents() {
  $("#search-input").addEventListener("input", handleSearch);
  $("#open-cart-btn").addEventListener("click", openDrawer);
  $("#close-cart-btn").addEventListener("click", closeDrawer);
  $("#open-wishlist-btn").addEventListener("click", openWishlistDrawer);
  $("#close-wishlist-btn").addEventListener("click", closeWishlistDrawer);
  $("#drawer-backdrop").addEventListener("click", () => { closeDrawer(); closeWishlistDrawer(); });
  $("#sort-select").addEventListener("change", (e) => { currentSort = e.target.value; renderProducts(); });
  $("#close-detail-modal").addEventListener("click", () => closeModal("#detail-modal"));
  $("#detail-modal").addEventListener("click", (e) => { if (e.target.id === "detail-modal") closeModal("#detail-modal"); });
  $("#close-checkout-modal").addEventListener("click", () => closeModal("#checkout-modal"));
  $("#checkout-modal").addEventListener("click", (e) => { if (e.target.id === "checkout-modal") closeModal("#checkout-modal"); });
  $("#go-checkout-btn").addEventListener("click", openCheckout);
  $("#checkout-form").addEventListener("submit", submitOrder);
}

/* ---------------- Init ---------------- */
async function init() {
  bindEvents();
  renderCartCount();
  renderWishlistCount();
  await Promise.all([loadSettings(), loadBanners(), loadCategories(), loadReviews()]);
  await loadProducts();
}

init();

</script>
