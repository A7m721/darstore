<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">المتجر الإلكتروني</title>
<link rel="icon" id="favicon" href="">
<style>
/* =========================================================
   style.css — واجهة العملاء
   لوحة الألوان:
   --ink:      #10241E  (أخضر داكن جدًا، للنصوص والهيدر)
   --forest:   #1F5C4A  (أخضر أساسي)
   --forest-2: #2C7A61  (أخضر أفتح للتفاعل/hover)
   --gold:     #E3A62F  (ذهبي دافئ، للأسعار والتمييز)
   --cream:    #FBF9F4  (خلفية عامة)
   --paper:    #FFFFFF  (خلفية البطاقات)
   --line:     #E7E2D6  (فواصل خفيفة)
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@300;400;500;700&display=swap');

:root{
  --ink:#10241E;
  --forest:#1F5C4A;
  --forest-2:#2C7A61;
  --gold:#E3A62F;
  --gold-dark:#C98A16;
  --cream:#FBF9F4;
  --paper:#FFFFFF;
  --line:#E7E2D6;
  --radius:14px;
  --shadow: 0 6px 24px rgba(16,36,30,.08);
}

*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Tajawal', sans-serif;
  background:var(--cream);
  color:var(--ink);
  direction:rtl;
  line-height:1.6;
}
h1,h2,h3,.brand-name{font-family:'Almarai', sans-serif;}
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none;}
ul{list-style:none;}
.container{max-width:1240px; margin:0 auto; padding:0 20px;}

/* ---------- Skeleton / loading ---------- */
.skeleton{background:linear-gradient(90deg,#eee 25%,#f5f5f5 37%,#eee 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite;}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

/* ---------- Top bar ---------- */
.topbar{
  background:var(--ink); color:#cfe3da; font-size:13px;
}
.topbar .container{display:flex; justify-content:space-between; align-items:center; height:34px;}
.topbar a{opacity:.85}
.topbar a:hover{opacity:1}

/* ---------- Header ---------- */
header.site-header{
  background:var(--paper);
  border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:50;
  box-shadow:0 1px 0 rgba(0,0,0,.02);
}
.header-inner{
  display:flex; align-items:center; gap:24px;
  height:78px;
}
.brand{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.brand img{height:44px; width:44px; object-fit:contain; border-radius:10px;}
.brand-name{font-size:22px; font-weight:800; color:var(--forest);}

.search-box{
  flex:1; max-width:520px; position:relative;
}
.search-box input{
  width:100%; height:46px; border-radius:999px;
  border:1.5px solid var(--line); background:var(--cream);
  padding:0 46px 0 18px; font-size:15px; font-family:inherit;
  transition:border-color .2s;
}
.search-box input:focus{outline:none; border-color:var(--forest-2);}
.search-box svg{position:absolute; right:16px; top:50%; transform:translateY(-50%); width:18px; height:18px; stroke:#8a9791;}

.header-actions{display:flex; align-items:center; gap:18px; margin-right:auto;}
.cart-btn{
  position:relative; display:flex; align-items:center; gap:8px;
  background:var(--forest); color:#fff; padding:11px 18px; border-radius:999px;
  font-weight:700; font-size:14px; transition:background .2s;
}
.cart-btn:hover{background:var(--forest-2);}
.cart-count{
  position:absolute; top:-6px; left:-6px; background:var(--gold);
  color:var(--ink); font-size:11px; font-weight:800; min-width:20px; height:20px;
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  border:2px solid var(--paper);
}

.main-nav{border-top:1px solid var(--line);}
.main-nav ul{display:flex; gap:26px; height:48px; align-items:center; overflow-x:auto;}
.main-nav a{font-size:14.5px; font-weight:500; white-space:nowrap; color:#3a463f;}
.main-nav a:hover{color:var(--forest);}

/* ---------- Categories strip ---------- */
.cats-section{padding:22px 0 6px;}
.cats-track{display:flex; gap:16px; overflow-x:auto; padding-bottom:10px; scrollbar-width:thin;}
.cat-pill{
  flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:8px;
  cursor:pointer; width:88px; text-align:center;
}
.cat-pill .circle{
  width:68px; height:68px; border-radius:50%; overflow:hidden;
  background:var(--paper); border:2px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  transition:border-color .2s, transform .2s;
}
.cat-pill.active .circle, .cat-pill:hover .circle{border-color:var(--forest); transform:translateY(-2px);}
.cat-pill .circle img{width:100%; height:100%; object-fit:cover;}
.cat-pill span{font-size:12.5px; font-weight:500; color:#3a463f;}
.cat-pill.active span{color:var(--forest); font-weight:700;}

/* ---------- Hero / Banners ---------- */
.hero{position:relative; margin:18px 0 34px; border-radius:20px; overflow:hidden;}
.hero-slide{
  position:relative; min-height:340px; display:flex; align-items:center;
  background-size:cover; background-position:center;
}
.hero-slide::before{
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg, rgba(16,36,30,.78) 10%, rgba(16,36,30,.15) 70%);
}
.hero-content{position:relative; z-index:2; color:#fff; padding:0 48px; max-width:560px;}
.hero-content h2{font-size:34px; margin-bottom:12px; line-height:1.3;}
.hero-content p{font-size:15.5px; opacity:.92; margin-bottom:20px;}
.hero-content a.btn{
  display:inline-block; background:var(--gold); color:var(--ink); font-weight:800;
  padding:12px 28px; border-radius:999px; font-size:14.5px;
}
.hero-dots{position:absolute; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:3;}
.hero-dots span{width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.5); cursor:pointer;}
.hero-dots span.active{background:#fff; width:22px; border-radius:4px;}

/* ---------- Section titles ---------- */
.section-title{display:flex; align-items:center; justify-content:space-between; margin:36px 0 18px;}
.section-title h3{font-size:22px; position:relative; padding-right:16px;}
.section-title h3::before{content:''; position:absolute; right:0; top:4px; bottom:4px; width:5px; background:var(--gold); border-radius:3px;}

/* ---------- Products grid ---------- */
.products-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:20px;
  margin-bottom:20px;
}
.product-card{
  background:var(--paper); border-radius:var(--radius); overflow:hidden;
  box-shadow:var(--shadow); display:flex; flex-direction:column;
  transition:transform .2s, box-shadow .2s;
  border:1px solid var(--line);
}
.product-card:hover{transform:translateY(-4px); box-shadow:0 12px 30px rgba(16,36,30,.13);}
.product-thumb{position:relative; aspect-ratio:1/1; background:#f1efe8; overflow:hidden; cursor:pointer;}
.product-thumb img{width:100%; height:100%; object-fit:cover; transition:transform .35s;}
.product-card:hover .product-thumb img{transform:scale(1.06);}
.badge-discount{
  position:absolute; top:10px; right:10px; background:var(--forest); color:#fff;
  font-size:12px; font-weight:800; padding:4px 9px; border-radius:8px;
}
.badge-oos{
  position:absolute; inset:0; background:rgba(16,36,30,.55); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;
}
.product-info{padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px; flex:1;}
.product-name{font-size:15px; font-weight:700; cursor:pointer; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:40px;}
.product-name:hover{color:var(--forest);}
.price-row{display:flex; align-items:baseline; gap:8px;}
.price-now{font-size:18px; font-weight:800; color:var(--forest);}
.price-old{font-size:13px; color:#9aa39c; text-decoration:line-through;}
.product-actions{display:flex; gap:8px; margin-top:auto;}
.btn-details{
  flex:1; background:var(--cream); border:1px solid var(--line); border-radius:10px;
  padding:9px 8px; font-size:13px; font-weight:700; color:var(--ink);
}
.btn-details:hover{background:#f1efe6;}
.btn-add{
  flex:1; background:var(--forest); color:#fff; border-radius:10px; padding:9px 8px;
  font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px;
}
.btn-add:hover{background:var(--forest-2);}
.btn-add:disabled, .btn-details:disabled{opacity:.5; cursor:not-allowed;}

.empty-state{padding:60px 20px; text-align:center; color:#7c887f;}

/* ---------- Modal generic ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(16,36,30,.55); z-index:200;
  display:flex; align-items:center; justify-content:center; padding:20px;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.modal-overlay.open{opacity:1; pointer-events:auto;}
.modal-box{
  background:var(--paper); border-radius:18px; max-width:920px; width:100%;
  max-height:88vh; overflow-y:auto; position:relative; box-shadow:0 30px 60px rgba(0,0,0,.3);
  transform:translateY(16px); transition:transform .2s;
}
.modal-overlay.open .modal-box{transform:translateY(0);}
.modal-close{
  position:absolute; top:14px; left:14px; width:36px; height:36px; border-radius:50%;
  background:var(--cream); display:flex; align-items:center; justify-content:center; font-size:18px; z-index:5;
}
.modal-close:hover{background:var(--line);}

/* ---------- Product detail modal ---------- */
.detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:0;}
.detail-gallery{background:#f1efe8; padding:24px; display:flex; flex-direction:column; gap:12px;}
.detail-gallery .main-img{aspect-ratio:1/1; border-radius:14px; overflow:hidden; background:#e8e5da;}
.detail-gallery .main-img img{width:100%; height:100%; object-fit:cover;}
.thumb-row{display:flex; gap:8px;}
.thumb-row img{width:60px; height:60px; object-fit:cover; border-radius:8px; cursor:pointer; border:2px solid transparent;}
.thumb-row img.active{border-color:var(--forest);}
.detail-info{padding:44px 30px 30px; display:flex; flex-direction:column; gap:14px;}
.detail-cat{font-size:12.5px; color:var(--forest-2); font-weight:700;}
.detail-info h2{font-size:24px;}
.detail-desc{color:#5b665e; font-size:14.5px; line-height:1.8;}
.detail-price-row{display:flex; align-items:baseline; gap:12px;}
.detail-price-row .price-now{font-size:26px;}
.detail-stock{font-size:13px; color:#7c887f;}
.qty-row{display:flex; align-items:center; gap:14px; margin-top:6px;}
.qty-control{display:flex; align-items:center; border:1.5px solid var(--line); border-radius:10px; overflow:hidden;}
.qty-control button{width:38px; height:38px; background:var(--cream); font-size:18px;}
.qty-control span{width:42px; text-align:center; font-weight:700;}
.detail-add-btn{
  background:var(--forest); color:#fff; padding:14px; border-radius:12px; font-weight:800; font-size:15px;
}
.detail-add-btn:hover{background:var(--forest-2);}

@media(max-width:760px){
  .detail-grid{grid-template-columns:1fr;}
}

/* ---------- Cart drawer ---------- */
.cart-drawer{
  position:fixed; top:0; bottom:0; left:0; width:100%; max-width:420px;
  background:var(--paper); z-index:250; transform:translateX(-100%);
  transition:transform .28s ease; display:flex; flex-direction:column;
  box-shadow:10px 0 40px rgba(0,0,0,.15);
}
.cart-drawer.open{transform:translateX(0);}
.cart-header{padding:20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
.cart-header h3{font-size:18px;}
.cart-items{flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:14px;}
.cart-item{display:flex; gap:12px; align-items:center; border-bottom:1px solid var(--line); padding-bottom:14px;}
.cart-item img{width:62px; height:62px; object-fit:cover; border-radius:10px; background:#eee;}
.cart-item-info{flex:1;}
.cart-item-info h4{font-size:14px; margin-bottom:4px;}
.cart-item-info .price-now{font-size:14px;}
.cart-item-qty{display:flex; align-items:center; gap:8px;}
.cart-item-qty button{width:26px; height:26px; border-radius:6px; background:var(--cream); border:1px solid var(--line);}
.cart-remove{color:#c0453a; font-size:12.5px; margin-top:4px;}
.cart-footer{padding:18px 20px; border-top:1px solid var(--line);}
.cart-total-row{display:flex; justify-content:space-between; font-weight:800; font-size:17px; margin-bottom:14px;}
.checkout-btn{width:100%; background:var(--gold); color:var(--ink); padding:14px; border-radius:12px; font-weight:800; font-size:15px;}
.checkout-btn:hover{background:var(--gold-dark); color:#fff;}
.cart-empty{text-align:center; color:#8a9791; padding:60px 20px;}
.drawer-backdrop{position:fixed; inset:0; background:rgba(16,36,30,.5); z-index:240; opacity:0; pointer-events:none; transition:opacity .2s;}
.drawer-backdrop.open{opacity:1; pointer-events:auto;}

/* ---------- Checkout form ---------- */
.checkout-form{display:flex; flex-direction:column; gap:14px; padding:26px;}
.checkout-form h3{font-size:19px; margin-bottom:6px;}
.form-group label{display:block; font-size:13.5px; font-weight:700; margin-bottom:6px;}
.form-group input, .form-group textarea{
  width:100%; border:1.5px solid var(--line); border-radius:10px; padding:11px 14px;
  font-family:inherit; font-size:14.5px; background:var(--cream);
}
.form-group input:focus, .form-group textarea:focus{outline:none; border-color:var(--forest-2);}
.order-summary{background:var(--cream); border-radius:12px; padding:14px; font-size:14px;}
.order-summary .row{display:flex; justify-content:space-between; padding:4px 0;}
.submit-order-btn{background:var(--forest); color:#fff; padding:14px; border-radius:12px; font-weight:800;}
.submit-order-btn:hover{background:var(--forest-2);}
.form-msg{font-size:13.5px; padding:10px; border-radius:8px;}
.form-msg.success{background:#e4f5ec; color:#1c6b47;}
.form-msg.error{background:#fbe9e7; color:#c0453a;}

/* ---------- Toast ---------- */
.toast{
  position:fixed; bottom:26px; right:50%; transform:translateX(50%);
  background:var(--ink); color:#fff; padding:13px 22px; border-radius:999px;
  font-size:14px; z-index:400; opacity:0; transition:opacity .25s, transform .25s;
  pointer-events:none;
}
.toast.show{opacity:1;}

/* ---------- Footer ---------- */
footer.site-footer{background:var(--ink); color:#cfe3da; margin-top:60px; padding:48px 0 0;}
.footer-grid{display:grid; grid-template-columns:2fr 1fr 1fr; gap:36px; padding-bottom:36px;}
.footer-grid h4{color:#fff; font-size:16px; margin-bottom:14px;}
.footer-grid p, .footer-grid a{font-size:13.5px; color:#a9bdb2; display:block; margin-bottom:8px;}
.footer-grid a:hover{color:#fff;}
.social-row{display:flex; gap:10px; margin-top:10px;}
.social-row a{
  width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.08);
  display:flex; align-items:center; justify-content:center; margin-bottom:0;
}
.social-row a:hover{background:var(--forest-2);}
.footer-bottom{border-top:1px solid rgba(255,255,255,.1); text-align:center; padding:16px 0; font-size:12.5px; color:#8ea298;}

@media(max-width:900px){
  .footer-grid{grid-template-columns:1fr 1fr;}
}
@media(max-width:640px){
  .header-inner{flex-wrap:wrap; height:auto; padding:12px 0; gap:12px;}
  .search-box{order:3; max-width:100%; flex-basis:100%;}
  .hero-content{padding:0 26px;}
  .hero-content h2{font-size:24px;}
  .footer-grid{grid-template-columns:1fr;}
}

</style>
</head>
<body>

<!-- ============ Top bar ============ -->
<div class="topbar">
  <div class="container">
    <span id="topbar-phone"></span>
    <span id="topbar-tagline">تسوق الآن واستمتع بأفضل العروض</span>
  </div>
</div>

<!-- ============ Header ============ -->
<header class="site-header">
  <div class="container header-inner">
    <a href="#" class="brand">
      <img id="store-logo" src="" alt="شعار المتجر">
      <span class="brand-name" id="store-name">المتجر</span>
    </a>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="ابحث عن منتج...">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </div>

    <div class="header-actions">
      <button class="cart-btn" id="open-cart-btn">
        🛒 السلة
        <span class="cart-count" id="cart-count">0</span>
      </button>
    </div>
  </div>
  <nav class="main-nav">
    <div class="container">
      <ul id="nav-categories-list">
        <li><a href="#products" data-cat="all" class="nav-cat-link">جميع المنتجات</a></li>
      </ul>
    </div>
  </nav>
</header>

<main class="container">

  <!-- ============ Categories strip ============ -->
  <section class="cats-section">
    <div class="cats-track" id="cats-track">
      <!-- categories injected by JS -->
    </div>
  </section>

  <!-- ============ Hero banners ============ -->
  <section class="hero" id="hero-section">
    <div id="hero-track"></div>
    <div class="hero-dots" id="hero-dots"></div>
  </section>

  <!-- ============ Products ============ -->
  <section id="products">
    <div class="section-title">
      <h3 id="products-title">كل المنتجات</h3>
    </div>
    <div class="products-grid" id="products-grid">
      <!-- product cards injected by JS -->
    </div>
  </section>

</main>

<!-- ============ Footer ============ -->
<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <h4 id="footer-store-name">المتجر</h4>
      <p id="footer-address"></p>
      <p id="footer-phone"></p>
      <p id="footer-email"></p>
      <div class="social-row" id="footer-social"></div>
    </div>
    <div>
      <h4>روابط</h4>
      <a href="#" id="link-privacy">سياسة الخصوصية</a>
      <a href="#" id="link-terms">الشروط والأحكام</a>
    </div>
    <div>
      <h4>تواصل معنا</h4>
      <a id="link-whatsapp" href="#" target="_blank">واتساب</a>
    </div>
  </div>
  <div class="footer-bottom">© <span id="footer-year"></span> جميع الحقوق محفوظة</div>
</footer>

<!-- ============ Product Detail Modal ============ -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal-box">
    <button class="modal-close" id="close-detail-modal">✕</button>
    <div class="detail-grid" id="detail-content"><!-- injected --></div>
  </div>
</div>

<!-- ============ Cart Drawer ============ -->
<div class="drawer-backdrop" id="drawer-backdrop"></div>
<div class="cart-drawer" id="cart-drawer">
  <div class="cart-header">
    <h3>سلة المشتريات</h3>
    <button class="modal-close" id="close-cart-btn" style="position:static;">✕</button>
  </div>
  <div class="cart-items" id="cart-items-list"></div>
  <div class="cart-footer" id="cart-footer">
    <div class="cart-total-row"><span>الإجمالي</span><span id="cart-total">0 ج.م</span></div>
    <button class="checkout-btn" id="go-checkout-btn">إتمام الشراء</button>
  </div>
</div>

<!-- ============ Checkout Modal ============ -->
<div class="modal-overlay" id="checkout-modal">
  <div class="modal-box" style="max-width:520px;">
    <button class="modal-close" id="close-checkout-modal">✕</button>
    <form class="checkout-form" id="checkout-form">
      <h3>إتمام الطلب</h3>
      <div class="form-group">
        <label>الاسم الكامل</label>
        <input type="text" id="cust-name" required>
      </div>
      <div class="form-group">
        <label>رقم الهاتف</label>
        <input type="tel" id="cust-phone" required>
      </div>
      <div class="form-group">
        <label>العنوان بالتفصيل</label>
        <textarea id="cust-address" rows="3" required></textarea>
      </div>
      <div class="order-summary" id="order-summary"></div>
      <div id="checkout-msg"></div>
      <button type="submit" class="submit-order-btn" id="submit-order-btn">تأكيد الطلب</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">

// =========================================================
// customer.js — منطق واجهة العملاء (index.html)

/* ---------------- State ---------------- */
let ALL_PRODUCTS = [];
let ALL_CATEGORIES = [];
let SETTINGS = {};
let currentCategory = "all";
let currentSearch = "";
let cart = JSON.parse(localStorage.getItem("store_cart") || "[]");
let heroSlideIndex = 0;
let heroTimer = null;

/* ---------------- Helpers ---------------- */
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);
const money = (n) => `${Number(n || 0).toLocaleString("ar-EG")} ج.م`;

function showToast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

function saveCart() {
  localStorage.setItem("store_cart", JSON.stringify(cart));
  renderCartCount();
}

/* ---------------- Settings ---------------- */
async function loadSettings() {
  try {
    const snap = await getDoc(doc(db, "settings", "main"));
    SETTINGS = snap.exists() ? snap.data() : {};
  } catch (e) {
    console.error("خطأ في تحميل الإعدادات:", e);
    SETTINGS = {};
  }
  applySettings();
}

function applySettings() {
  const s = SETTINGS;
  if (s.storeName) {
    $("#store-name").textContent = s.storeName;
    $("#footer-store-name").textContent = s.storeName;
    $("#page-title").textContent = s.storeName;
  }
  if (s.logoUrl) $("#store-logo").src = s.logoUrl;
  if (s.faviconUrl) $("#favicon").href = s.faviconUrl;
  if (s.phone) $("#topbar-phone").textContent = "📞 " + s.phone;
  if (s.phone) $("#footer-phone").textContent = "📞 " + s.phone;
  if (s.email) $("#footer-email").textContent = "✉️ " + s.email;
  if (s.address) $("#footer-address").textContent = "📍 " + s.address;
  if (s.privacyPolicy) $("#link-privacy").addEventListener("click", (e) => {
    e.preventDefault(); openTextModal("سياسة الخصوصية", s.privacyPolicy);
  });
  if (s.termsAndConditions) $("#link-terms").addEventListener("click", (e) => {
    e.preventDefault(); openTextModal("الشروط والأحكام", s.termsAndConditions);
  });
  if (s.whatsapp) $("#link-whatsapp").href = `https://wa.me/${s.whatsapp.replace(/\D/g,"")}`;

  const social = $("#footer-social");
  social.innerHTML = "";
  if (s.facebook) social.innerHTML += `<a href="${s.facebook}" target="_blank">f</a>`;
  if (s.instagram) social.innerHTML += `<a href="${s.instagram}" target="_blank">ig</a>`;
  if (s.whatsapp) social.innerHTML += `<a href="https://wa.me/${s.whatsapp.replace(/\D/g,"")}" target="_blank">wa</a>`;

  $("#footer-year").textContent = new Date().getFullYear();
}

function openTextModal(title, text) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay open";
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:600px; padding:36px;">
      <button class="modal-close" style="position:absolute;">✕</button>
      <h3 style="margin-bottom:16px;">${title}</h3>
      <p style="white-space:pre-line; color:#5b665e; font-size:14.5px; line-height:1.9;">${text}</p>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector(".modal-close").onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
}

/* ---------------- Banners ---------------- */
async function loadBanners() {
  try {
    const q = query(collection(db, "banners"), orderBy("order", "asc"));
    const snap = await getDocs(q);
    const banners = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(b => b.active !== false);
    renderHero(banners);
  } catch (e) {
    console.error("خطأ في تحميل البانرات:", e);
    $("#hero-section").style.display = "none";
  }
}

function renderHero(banners) {
  if (!banners.length) { $("#hero-section").style.display = "none"; return; }
  const track = $("#hero-track");
  const dots = $("#hero-dots");
  track.innerHTML = banners.map((b, i) => `
    <div class="hero-slide" data-i="${i}" style="background-image:url('${b.imageUrl || ""}'); ${i === 0 ? "" : "display:none;"}">
      <div class="hero-content">
        <h2>${b.title || ""}</h2>
        <p>${b.description || ""}</p>
        ${b.buttonLink ? `<a class="btn" href="${b.buttonLink}">تسوق الآن</a>` : ""}
      </div>
    </div>`).join("");
  dots.innerHTML = banners.map((_, i) => `<span data-i="${i}" class="${i === 0 ? "active" : ""}"></span>`).join("");
  dots.querySelectorAll("span").forEach(s => s.onclick = () => setHeroSlide(+s.dataset.i, banners.length));

  clearInterval(heroTimer);
  if (banners.length > 1) {
    heroTimer = setInterval(() => setHeroSlide((heroSlideIndex + 1) % banners.length, banners.length), 5000);
  }
}

function setHeroSlide(i, total) {
  heroSlideIndex = i;
  $$("#hero-track .hero-slide").forEach(el => el.style.display = (+el.dataset.i === i ? "" : "none"));
  $$("#hero-dots span").forEach(el => el.classList.toggle("active", +el.dataset.i === i));
}

/* ---------------- Categories ---------------- */
async function loadCategories() {
  try {
    const q = query(collection(db, "categories"), orderBy("order", "asc"));
    const snap = await getDocs(q);
    ALL_CATEGORIES = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) {
    console.error("خطأ في تحميل الأقسام:", e);
    ALL_CATEGORIES = [];
  }
  renderCategories();
}

function renderCategories() {
  const track = $("#cats-track");
  const navList = $("#nav-categories-list");

  track.innerHTML = `
    <div class="cat-pill ${currentCategory === "all" ? "active" : ""}" data-cat="all">
      <div class="circle">🛍️</div><span>الكل</span>
    </div>` +
    ALL_CATEGORIES.map(c => `
      <div class="cat-pill ${currentCategory === c.id ? "active" : ""}" data-cat="${c.id}">
        <div class="circle"><img src="${c.imageUrl || ""}" alt="${c.name || ""}"></div>
        <span>${c.name || ""}</span>
      </div>`).join("");

  navList.innerHTML = `<li><a href="#products" data-cat="all" class="nav-cat-link">جميع المنتجات</a></li>` +
    ALL_CATEGORIES.map(c => `<li><a href="#products" data-cat="${c.id}" class="nav-cat-link">${c.name || ""}</a></li>`).join("");

  $$(".cat-pill").forEach(el => el.onclick = () => { currentCategory = el.dataset.cat; renderCategories(); renderProducts(); });
  $$(".nav-cat-link").forEach(el => el.onclick = () => { currentCategory = el.dataset.cat; renderCategories(); renderProducts(); });
}

/* ---------------- Products ---------------- */
async function loadProducts() {
  try {
    const snap = await getDocs(collection(db, "products"));
    ALL_PRODUCTS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) {
    console.error("خطأ في تحميل المنتجات:", e);
    ALL_PRODUCTS = [];
  }
  renderProducts();
}

function getFilteredProducts() {
  return ALL_PRODUCTS.filter(p => {
    const matchesCat = currentCategory === "all" || p.category === currentCategory;
    const s = currentSearch.trim().toLowerCase();
    const matchesSearch = !s || (p.name || "").toLowerCase().includes(s) || (p.description || "").toLowerCase().includes(s);
    return matchesCat && matchesSearch;
  });
}

function renderProducts() {
  const grid = $("#products-grid");
  const list = getFilteredProducts();
  $("#products-title").textContent = currentCategory === "all"
    ? "كل المنتجات"
    : (ALL_CATEGORIES.find(c => c.id === currentCategory)?.name || "المنتجات");

  if (!list.length) {
    grid.innerHTML = `<div class="empty-state">لا توجد منتجات مطابقة</div>`;
    return;
  }

  grid.innerHTML = list.map(p => {
    const hasDiscount = p.oldPrice && p.oldPrice > p.price;
    const discountPct = hasDiscount ? Math.round((1 - p.price / p.oldPrice) * 100) : 0;
    const outOfStock = p.status === "unavailable" || Number(p.quantity) <= 0;
    return `
    <div class="product-card" data-id="${p.id}">
      <div class="product-thumb" data-action="details">
        <img src="${p.mainImage || ""}" alt="${p.name || ""}" loading="lazy">
        ${hasDiscount ? `<span class="badge-discount">خصم ${discountPct}%</span>` : ""}
        ${outOfStock ? `<div class="badge-oos">غير متوفر</div>` : ""}
      </div>
      <div class="product-info">
        <div class="product-name" data-action="details">${p.name || ""}</div>
        <div class="price-row">
          <span class="price-now">${money(p.price)}</span>
          ${hasDiscount ? `<span class="price-old">${money(p.oldPrice)}</span>` : ""}
        </div>
        <div class="product-actions">
          <button class="btn-details" data-action="details">التفاصيل</button>
          <button class="btn-add" data-action="add" ${outOfStock ? "disabled" : ""}>أضف للسلة</button>
        </div>
      </div>
    </div>`;
  }).join("");

  grid.querySelectorAll(".product-card").forEach(card => {
    const id = card.dataset.id;
    card.querySelectorAll('[data-action="details"]').forEach(el => el.onclick = () => openDetailModal(id));
    const addBtn = card.querySelector('[data-action="add"]');
    if (addBtn) addBtn.onclick = () => addToCart(id, 1);
  });
}

/* ---------------- Product detail modal ---------------- */
function openDetailModal(productId) {
  const p = ALL_PRODUCTS.find(x => x.id === productId);
  if (!p) return;
  const images = [p.mainImage, ...(p.images || [])].filter(Boolean);
  const outOfStock = p.status === "unavailable" || Number(p.quantity) <= 0;
  const catName = ALL_CATEGORIES.find(c => c.id === p.category)?.name || "";
  const hasDiscount = p.oldPrice && p.oldPrice > p.price;

  $("#detail-content").innerHTML = `
    <div class="detail-gallery">
      <div class="main-img"><img id="detail-main-img" src="${images[0] || ""}"></div>
      <div class="thumb-row">
        ${images.map((img, i) => `<img src="${img}" class="${i === 0 ? "active" : ""}" data-src="${img}">`).join("")}
      </div>
    </div>
    <div class="detail-info">
      <div class="detail-cat">${catName}</div>
      <h2>${p.name || ""}</h2>
      <p class="detail-desc">${p.description || ""}</p>
      <div class="detail-price-row">
        <span class="price-now">${money(p.price)}</span>
        ${hasDiscount ? `<span class="price-old">${money(p.oldPrice)}</span>` : ""}
      </div>
      <div class="detail-stock">${outOfStock ? "غير متوفر حاليًا" : `الكمية المتاحة: ${p.quantity ?? "-"}`}</div>
      <div class="qty-row">
        <div class="qty-control">
          <button id="qty-minus">−</button>
          <span id="qty-value">1</span>
          <button id="qty-plus">+</button>
        </div>
      </div>
      <button class="detail-add-btn" id="detail-add-btn" ${outOfStock ? "disabled" : ""}>إضافة للسلة</button>
    </div>`;

  $("#detail-content").querySelectorAll(".thumb-row img").forEach(t => {
    t.onclick = () => {
      $("#detail-main-img").src = t.dataset.src;
      $("#detail-content").querySelectorAll(".thumb-row img").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
    };
  });

  let qty = 1;
  const qtyEl = $("#qty-value");
  $("#qty-minus").onclick = () => { qty = Math.max(1, qty - 1); qtyEl.textContent = qty; };
  $("#qty-plus").onclick = () => { qty = Math.min(Number(p.quantity) || 99, qty + 1); qtyEl.textContent = qty; };
  const addBtn = $("#detail-add-btn");
  if (addBtn) addBtn.onclick = () => { addToCart(p.id, qty); closeModal("#detail-modal"); };

  openModal("#detail-modal");
}

/* ---------------- Modal utils ---------------- */
function openModal(sel) { $(sel).classList.add("open"); document.body.style.overflow = "hidden"; }
function closeModal(sel) { $(sel).classList.remove("open"); document.body.style.overflow = ""; }

/* ---------------- Cart ---------------- */
function addToCart(productId, qty) {
  const p = ALL_PRODUCTS.find(x => x.id === productId);
  if (!p) return;
  const existing = cart.find(c => c.id === productId);
  if (existing) existing.qty += qty;
  else cart.push({ id: productId, qty });
  saveCart();
  showToast("تمت الإضافة إلى السلة ✔");
}

function renderCartCount() {
  const total = cart.reduce((s, c) => s + c.qty, 0);
  $("#cart-count").textContent = total;
}

function renderCartDrawer() {
  const list = $("#cart-items-list");
  if (!cart.length) {
    list.innerHTML = `<div class="cart-empty">سلتك فارغة حاليًا</div>`;
    $("#cart-total").textContent = money(0);
    return;
  }
  let total = 0;
  list.innerHTML = cart.map(item => {
    const p = ALL_PRODUCTS.find(x => x.id === item.id);
    if (!p) return "";
    const lineTotal = p.price * item.qty;
    total += lineTotal;
    return `
      <div class="cart-item" data-id="${item.id}">
        <img src="${p.mainImage || ""}">
        <div class="cart-item-info">
          <h4>${p.name}</h4>
          <div class="price-now">${money(p.price)}</div>
          <div class="cart-item-qty">
            <button data-act="minus">−</button>
            <span>${item.qty}</span>
            <button data-act="plus">+</button>
          </div>
          <div class="cart-remove" data-act="remove">إزالة</div>
        </div>
      </div>`;
  }).join("");
  $("#cart-total").textContent = money(total);

  list.querySelectorAll(".cart-item").forEach(el => {
    const id = el.dataset.id;
    el.querySelector('[data-act="minus"]').onclick = () => changeQty(id, -1);
    el.querySelector('[data-act="plus"]').onclick = () => changeQty(id, 1);
    el.querySelector('[data-act="remove"]').onclick = () => removeFromCart(id);
  });
}

function changeQty(id, delta) {
  const item = cart.find(c => c.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(c => c.id !== id);
  saveCart();
  renderCartDrawer();
}

function removeFromCart(id) {
  cart = cart.filter(c => c.id !== id);
  saveCart();
  renderCartDrawer();
}

function getCartTotal() {
  return cart.reduce((sum, item) => {
    const p = ALL_PRODUCTS.find(x => x.id === item.id);
    return sum + (p ? p.price * item.qty : 0);
  }, 0);
}

/* ---------------- Checkout ---------------- */
function openCheckout() {
  if (!cart.length) { showToast("السلة فارغة"); return; }
  const summary = $("#order-summary");
  const total = getCartTotal();
  summary.innerHTML = cart.map(item => {
    const p = ALL_PRODUCTS.find(x => x.id === item.id);
    if (!p) return "";
    return `<div class="row"><span>${p.name} × ${item.qty}</span><span>${money(p.price * item.qty)}</span></div>`;
  }).join("") + `<div class="row" style="font-weight:800; border-top:1px solid var(--line); margin-top:6px; padding-top:8px;"><span>الإجمالي</span><span>${money(total)}</span></div>`;
  $("#checkout-msg").innerHTML = "";
  closeModal("#detail-modal");
  closeDrawer();
  openModal("#checkout-modal");
}

async function submitOrder(e) {
  e.preventDefault();
  const btn = $("#submit-order-btn");
  const name = $("#cust-name").value.trim();
  const phone = $("#cust-phone").value.trim();
  const address = $("#cust-address").value.trim();
  if (!name || !phone || !address) return;

  btn.disabled = true;
  btn.textContent = "جاري إرسال الطلب...";

  try {
    const items = cart.map(item => {
      const p = ALL_PRODUCTS.find(x => x.id === item.id);
      return { productId: item.id, name: p?.name || "", price: p?.price || 0, qty: item.qty };
    });
    const total = getCartTotal();

    await addDoc(collection(db, "orders"), {
      customerName: name,
      phone,
      address,
      items,
      total,
      status: "جديد",
      createdAt: serverTimestamp()
    });

    await upsertCustomer(name, phone, total);

    $("#checkout-msg").innerHTML = `<div class="form-msg success">تم إرسال طلبك بنجاح! سنتواصل معك قريبًا.</div>`;
    cart = [];
    saveCart();
    setTimeout(() => {
      closeModal("#checkout-modal");
      $("#checkout-form").reset();
    }, 1800);
  } catch (err) {
    console.error("خطأ في إرسال الطلب:", err);
    $("#checkout-msg").innerHTML = `<div class="form-msg error">حدث خطأ أثناء إرسال الطلب، حاول مرة أخرى.</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "تأكيد الطلب";
  }
}

async function upsertCustomer(name, phone, orderTotal) {
  try {
    const q = query(collection(db, "customers"), where("phone", "==", phone));
    const snap = await getDocs(q);
    if (snap.empty) {
      await addDoc(collection(db, "customers"), {
        name, phone,
        ordersCount: 1,
        totalPurchases: orderTotal,
        lastOrder: serverTimestamp()
      });
    } else {
      const custDoc = snap.docs[0];
      await updateDoc(doc(db, "customers", custDoc.id), {
        name,
        ordersCount: increment(1),
        totalPurchases: increment(orderTotal),
        lastOrder: serverTimestamp()
      });
    }
  } catch (e) {
    console.error("خطأ في تحديث بيانات العميل:", e);
  }
}

/* ---------------- Drawer ---------------- */
function openDrawer() {
  renderCartDrawer();
  $("#cart-drawer").classList.add("open");
  $("#drawer-backdrop").classList.add("open");
}
function closeDrawer() {
  $("#cart-drawer").classList.remove("open");
  $("#drawer-backdrop").classList.remove("open");
}

/* ---------------- Search ---------------- */
let searchTimer;
function handleSearch(e) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    currentSearch = e.target.value;
    renderProducts();
  }, 250);
}

/* ---------------- Event bindings ---------------- */
function bindEvents() {
  $("#search-input").addEventListener("input", handleSearch);
  $("#open-cart-btn").addEventListener("click", openDrawer);
  $("#close-cart-btn").addEventListener("click", closeDrawer);
  $("#drawer-backdrop").addEventListener("click", closeDrawer);
  $("#close-detail-modal").addEventListener("click", () => closeModal("#detail-modal"));
  $("#detail-modal").addEventListener("click", (e) => { if (e.target.id === "detail-modal") closeModal("#detail-modal"); });
  $("#close-checkout-modal").addEventListener("click", () => closeModal("#checkout-modal"));
  $("#checkout-modal").addEventListener("click", (e) => { if (e.target.id === "checkout-modal") closeModal("#checkout-modal"); });
  $("#go-checkout-btn").addEventListener("click", openCheckout);
  $("#checkout-form").addEventListener("submit", submitOrder);
}

/* ---------------- Init ---------------- */
async function init() {
  bindEvents();
  renderCartCount();
  await Promise.all([loadSettings(), loadBanners(), loadCategories(), loadProducts()]);
}

init();

</script>
